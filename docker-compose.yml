services:
  minio:
    image: minio/minio:latest
    container_name: cnpj_minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline:
    build: .
    container_name: cnpj_pipeline
    depends_on:
      minio:
        condition: service_healthy
    # DNS explícito: em algumas configurações de WSL2, o DNS padrão do Docker
    # para de resolver nomes de domínio após instabilidade de rede (ex: notebook
    # suspenso). Fixar servidores DNS públicos evita esse problema.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      USE_MINIO: "true"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: "false"
    # Parametrização do mês/ano de execução (requisito funcional #1).
    # Comando padrão abaixo roda o mês completo (mais lento). Para testar
    # rápido, prefira: docker compose run --rm pipeline --year 2025 --month 12 --sample 1
    command: ["--year", "2025", "--month", "12"]

  # ------------------------------------------------------------------ #
  # AIRFLOW — orquestração das 3 camadas (dags/cnpj_pipeline_dag.py)
  # ------------------------------------------------------------------ #

  postgres:
    image: postgres:16
    container_name: cnpj_airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"   # exposto para acesso via cliente SQL externo (ex: DBeaver)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: cnpj_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONPATH: /opt/airflow
      USE_MINIO: "true"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: "false"
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./airflow_logs:/opt/airflow/logs
      - ./airflow_plugins:/opt/airflow/plugins
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: cnpj_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      # Ajustes para ambientes com menos recurso (ex: WSL2 em notebooks):
      # o padrão do Airflow espera só 120s pelos workers do Gunicorn, o que
      # pode não ser suficiente quando o projeto está em disco mais lento
      # (pasta do Windows montada via /mnt/c) ou a máquina tem pouca CPU/RAM
      # disponível para o Docker.
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: airflow webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: cnpj_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    # DNS explícito: mesmo problema de resolução de nome já visto no
    # projeto original (WSL2 + instabilidade de rede derrubando o DNS
    # interno do Docker). Como as tarefas da DAG rodam DENTRO deste
    # container (LocalExecutor), é aqui que a correção precisa estar —
    # não adianta só no serviço "pipeline" antigo.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment: *airflow-env
    volumes: *airflow-volumes
    command: airflow scheduler

volumes:
  minio_data:
  postgres_data:

